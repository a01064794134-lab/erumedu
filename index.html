<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 웹 계산기</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter 및 JetBrains Mono (숫자 가독성용) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind 설정 (다크 모드 클래스 기반 활성화 및 커스텀 폰트) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)',
                        'dark-soft': '0 20px 40px -15px rgba(0, 0, 0, 0.5)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300 font-sans select-none">

    <!-- 알림 메시지 토스트 (alert 대체용) -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">
        <div id="toast-message" class="bg-slate-800 dark:bg-slate-700 text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium flex items-center gap-2">
            <span>알림</span>
        </div>
    </div>

    <!-- 메인 컨테이너: 계산기 + 히스토리 패널 -->
    <div class="w-full max-w-4xl flex flex-col md:flex-row gap-6 items-stretch justify-center">
        
        <!-- 계산기 본체 카드 -->
        <main class="w-full md:w-[400px] bg-white dark:bg-slate-900 rounded-3xl shadow-soft dark:shadow-dark-soft border border-slate-200/80 dark:border-slate-800 p-6 flex flex-col justify-between transition-colors duration-300">
            
            <!-- 상단 헤더: 타이틀 및 테마/히스토리 토글 -->
            <header class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                    <div class="w-3 h-3 rounded-full bg-amber-400"></div>
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <span class="ml-2 text-xs font-semibold tracking-wider uppercase text-slate-400 dark:text-slate-500">Calculator</span>
                </div>
                
                <div class="flex items-center gap-2">
                    <!-- 모바일용 히스토리 토글 버튼 -->
                    <button id="mobile-history-btn" aria-label="계산 기록 보기" class="md:hidden p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>

                    <!-- 다크/라이트 모드 전환 토글 버튼 -->
                    <button id="theme-toggle" aria-label="테마 변경" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- 해 아이콘 (다크 모드일 때 표시) -->
                        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <!-- 달 아이콘 (라이트 모드일 때 표시) -->
                        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 디스플레이 영역 -->
            <section class="bg-slate-50 dark:bg-slate-950/60 rounded-2xl p-5 mb-6 border border-slate-200/60 dark:border-slate-800/80 flex flex-col items-end justify-end min-h-[130px] relative group">
                <!-- 결과 복사 버튼 -->
                <button id="copy-btn" title="결과 복사" class="absolute top-3 left-3 p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-200/50 dark:hover:bg-slate-800 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>

                <!-- 이전 수식 표시줄 -->
                <div id="previous-operand" class="text-slate-400 dark:text-slate-500 font-mono text-sm sm:text-base h-6 overflow-x-auto max-w-full whitespace-nowrap mb-1"></div>
                
                <!-- 현재 입력/결과 숫자 표시줄 -->
                <div id="current-operand" class="text-slate-900 dark:text-white font-mono text-4xl sm:text-5xl font-semibold tracking-tight overflow-x-auto max-w-full whitespace-nowrap">0</div>
            </section>

            <!-- 키패드 그리드 -->
            <section class="grid grid-cols-4 gap-3">
                <!-- 1행: 초기화(AC), 부호전환(+/-), 백분율(%), 나눗셈(÷) -->
                <button data-action="clear" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-lg bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-900/50 active:scale-95 transition-all">AC</button>
                <button data-action="negate" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition-all">+/-</button>
                <button data-action="percent" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition-all">%</button>
                <button data-operator="÷" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 active:scale-95 transition-all">÷</button>

                <!-- 2행: 7, 8, 9, 곱셈(×) -->
                <button data-number="7" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">7</button>
                <button data-number="8" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">8</button>
                <button data-number="9" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">9</button>
                <button data-operator="×" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 active:scale-95 transition-all">×</button>

                <!-- 3행: 4, 5, 6, 뺄셈(-) -->
                <button data-number="4" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">4</button>
                <button data-number="5" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">5</button>
                <button data-number="6" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">6</button>
                <button data-operator="-" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 active:scale-95 transition-all">−</button>

                <!-- 4행: 1, 2, 3, 덧셈(+) -->
                <button data-number="1" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">1</button>
                <button data-number="2" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">2</button>
                <button data-number="3" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">3</button>
                <button data-operator="+" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 active:scale-95 transition-all">+</button>

                <!-- 5행: 0, 소수점(.), 백스페이스(⌫), 등호(=) -->
                <button data-number="0" class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-medium text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">0</button>
                <button data-number="." class="calc-btn h-14 sm:h-16 rounded-2xl font-mono font-bold text-xl bg-slate-50 dark:bg-slate-800/60 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all">.</button>
                <button data-action="delete" aria-label="백스페이스" class="calc-btn h-14 sm:h-16 rounded-2xl font-medium text-lg bg-slate-50 dark:bg-slate-800/60 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/80 active:scale-95 transition-all flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                </button>
                <button data-action="equals" class="calc-btn h-14 sm:h-16 rounded-2xl font-semibold text-2xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/30 active:scale-95 transition-all">=</button>
            </section>
        </main>

        <!-- 히스토리 패널 (데스크톱에서는 우측 고정, 모바일에서는 토글 표시) -->
        <aside id="history-panel" class="hidden md:flex flex-col w-full md:w-[320px] bg-white dark:bg-slate-900 rounded-3xl shadow-soft dark:shadow-dark-soft border border-slate-200/80 dark:border-slate-800 p-6 transition-colors duration-300 max-h-[600px]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h2 class="font-semibold text-base text-slate-800 dark:text-slate-100">계산 기록</h2>
                </div>
                <button id="clear-history-btn" class="text-xs font-medium text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 px-2.5 py-1 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors">
                    기록 삭제
                </button>
            </div>

            <!-- 기록 목록 컨테이너 -->
            <div id="history-list" class="flex-1 overflow-y-auto py-4 space-y-3 pr-1">
                <!-- 초기 빈 상태 메시지 -->
                <div id="empty-history" class="h-full flex flex-col items-center justify-center text-center py-12 text-slate-400 dark:text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                    </svg>
                    <p class="text-sm">아직 계산 기록이 없습니다.</p>
                    <p class="text-xs mt-1">계산을 완료하면 여기에 표시됩니다.</p>
                </div>
            </div>

            <!-- 하단 키보드 단축키 안내 -->
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-400 dark:text-slate-500 flex justify-between items-center">
                <span>키보드 입력 지원</span>
                <span class="font-mono bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded">Esc: AC / Backspace: ⌫</span>
            </div>
        </aside>

    </div>

    <!-- JavaScript 로직 -->
    <script>
        /**
         * 계산기 상태 및 로직을 관리하는 클래스
         */
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.history = [];
                this.clear();
            }

            // 모든 상태 초기화 (AC)
            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
            }

            // 마지막 자리 숫자 지우기 (Backspace)
            delete() {
                if (this.currentOperand === '오류') {
                    this.clear();
                    return;
                }
                if (this.shouldResetScreen) {
                    this.shouldResetScreen = false;
                }
                if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
            }

            // 숫자 및 소수점 추가
            appendNumber(number) {
                if (this.currentOperand === '오류') {
                    this.clear();
                }
                if (this.shouldResetScreen) {
                    this.currentOperand = '';
                    this.shouldResetScreen = false;
                }
                // 소수점 중복 방지
                if (number === '.' && this.currentOperand.includes('.')) return;
                // 소수점으로 시작할 때 '0.'으로 처리
                if (number === '.' && this.currentOperand === '') {
                    this.currentOperand = '0.';
                    return;
                }
                // 초기 '0' 대체 (소수점이 아닌 경우)
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    // 최대 입력 길이 제한 (15자리)
                    if (this.currentOperand.replace(/[^0-9]/g, '').length >= 15) {
                        showToast('최대 15자리까지 입력할 수 있습니다.');
                        return;
                    }
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
            }

            // 부호 전환 (+/-)
            negate() {
                if (this.currentOperand === '0' || this.currentOperand === '오류') return;
                if (this.currentOperand.startsWith('-')) {
                    this.currentOperand = this.currentOperand.slice(1);
                } else {
                    this.currentOperand = '-' + this.currentOperand;
                }
            }

            // 백분율 (%)
            percent() {
                if (this.currentOperand === '오류') return;
                const current = parseFloat(this.currentOperand);
                if (isNaN(current)) return;
                
                // 부동소수점 오차 보정을 위해 정밀도 처리
                const result = parseFloat((current / 100).toPrecision(12));
                this.currentOperand = result.toString();
            }

            // 연산자 선택 (+, -, ×, ÷)
            chooseOperation(operation) {
                if (this.currentOperand === '오류') return;
                if (this.currentOperand === '' && this.previousOperand !== '') {
                    this.operation = operation;
                    return;
                }
                if (this.previousOperand !== '' && !this.shouldResetScreen) {
                    this.compute(false);
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.shouldResetScreen = true;
            }

            // 사칙연산 수행 (=)
            compute(saveToHistory = true) {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            this.currentOperand = '오류';
                            this.previousOperand = '';
                            this.operation = undefined;
                            showToast('0으로 나눌 수 없습니다.');
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                // 자바스크립트 부동소수점 오차 해결 (예: 0.1 + 0.2 = 0.30000000000000004 방지)
                const formattedResult = parseFloat(computation.toPrecision(12));
                const expression = `${this.getDisplayNumber(prev)} ${this.operation} ${this.getDisplayNumber(current)}`;

                if (saveToHistory) {
                    this.addHistory(expression, formattedResult.toString());
                }

                this.currentOperand = formattedResult.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetScreen = true;
            }

            // 천 단위 콤마 포맷팅
            getDisplayNumber(number) {
                if (number === '오류') return '오류';
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                
                let integerDisplay;
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('ko-KR', { maximumFractionDigits: 0 });
                }

                // '-0' 처리
                if (stringNumber.startsWith('-') && integerDigits === 0 && !integerDisplay.startsWith('-')) {
                    integerDisplay = '-' + integerDisplay;
                }

                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            // 디스플레이 UI 업데이트 및 글자 크기 자동 조절
            updateDisplay() {
                const displayValue = this.getDisplayNumber(this.currentOperand);
                this.currentOperandTextElement.innerText = displayValue;

                // 숫자 길이에 따른 폰트 크기 동적 조절
                const len = displayValue.length;
                this.currentOperandTextElement.classList.remove('text-4xl', 'sm:text-5xl', 'text-3xl', 'sm:text-4xl', 'text-2xl', 'sm:text-3xl');
                if (len > 14) {
                    this.currentOperandTextElement.classList.add('text-2xl', 'sm:text-3xl');
                } else if (len > 10) {
                    this.currentOperandTextElement.classList.add('text-3xl', 'sm:text-4xl');
                } else {
                    this.currentOperandTextElement.classList.add('text-4xl', 'sm:text-5xl');
                }

                if (this.operation != null) {
                    this.previousOperandTextElement.innerText = `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandTextElement.innerText = '';
                }
            }

            // 히스토리 추가 및 렌더링
            addHistory(expression, result) {
                this.history.unshift({ expression, result });
                if (this.history.length > 50) {
                    this.history.pop(); // 최대 50개 유지
                }
                renderHistory();
            }

            // 히스토리 초기화
            clearHistory() {
                this.history = [];
                renderHistory();
            }
        }

        // DOM 요소 참조
        const previousOperandTextElement = document.getElementById('previous-operand');
        const currentOperandTextElement = document.getElementById('current-operand');
        const numberButtons = document.querySelectorAll('[data-number]');
        const operatorButtons = document.querySelectorAll('[data-operator]');
        const equalsButton = document.querySelector('[data-action="equals"]');
        const deleteButton = document.querySelector('[data-action="delete"]');
        const clearButton = document.querySelector('[data-action="clear"]');
        const negateButton = document.querySelector('[data-action="negate"]');
        const percentButton = document.querySelector('[data-action="percent"]');
        
        const historyList = document.getElementById('history-list');
        const emptyHistory = document.getElementById('empty-history');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const mobileHistoryBtn = document.getElementById('mobile-history-btn');
        const historyPanel = document.getElementById('history-panel');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const copyBtn = document.getElementById('copy-btn');

        // 계산기 인스턴스 생성
        const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);

        // 토스트 알림 함수
        let toastTimeout;
        function showToast(message) {
            const toastContainer = document.getElementById('toast-container');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.innerText = message;
            toastContainer.classList.remove('opacity-0', '-translate-y-4');
            toastContainer.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastContainer.classList.remove('opacity-100', 'translate-y-0');
                toastContainer.classList.add('opacity-0', '-translate-y-4');
            }, 2000);
        }

        // 히스토리 목록 렌더링 함수
        function renderHistory() {
            // 기존 항목 제거 (emptyHistory 제외)
            const items = historyList.querySelectorAll('.history-item');
            items.forEach(item => item.remove());

            if (calculator.history.length === 0) {
                emptyHistory.classList.remove('hidden');
                return;
            }

            emptyHistory.classList.add('hidden');

            calculator.history.forEach((item) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'history-item p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 hover:bg-indigo-50/70 dark:hover:bg-indigo-950/40 border border-slate-100 dark:border-slate-800 cursor-pointer transition-colors text-right group';
                itemDiv.title = '클릭하여 결과 불러오기';

                const exprP = document.createElement('p');
                exprP.className = 'text-xs font-mono text-slate-400 dark:text-slate-500 mb-1';
                exprP.innerText = `${item.expression} =`;

                const resP = document.createElement('p');
                resP.className = 'text-lg font-mono font-semibold text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors';
                resP.innerText = calculator.getDisplayNumber(item.result);

                itemDiv.appendChild(exprP);
                itemDiv.appendChild(resP);

                // 클릭 시 해당 결과값을 현재 입력창으로 불러오기
                itemDiv.addEventListener('click', () => {
                    calculator.currentOperand = item.result;
                    calculator.shouldResetScreen = true;
                    calculator.updateDisplay();
                    showToast('계산 결과를 불러왔습니다.');
                });

                historyList.appendChild(itemDiv);
            });
        }

        // 버튼 클릭 이벤트 바인딩
        numberButtons.forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.dataset.number);
                calculator.updateDisplay();
            });
        });

        operatorButtons.forEach(button => {
            button.addEventListener('click', () => {
                calculator.chooseOperation(button.dataset.operator);
                calculator.updateDisplay();
            });
        });

        equalsButton.addEventListener('click', () => {
            calculator.compute(true);
            calculator.updateDisplay();
        });

        clearButton.addEventListener('click', () => {
            calculator.clear();
            calculator.updateDisplay();
        });

        deleteButton.addEventListener('click', () => {
            calculator.delete();
            calculator.updateDisplay();
        });

        negateButton.addEventListener('click', () => {
            calculator.negate();
            calculator.updateDisplay();
        });

        percentButton.addEventListener('click', () => {
            calculator.percent();
            calculator.updateDisplay();
        });

        clearHistoryBtn.addEventListener('click', () => {
            if (calculator.history.length > 0) {
                calculator.clearHistory();
                showToast('계산 기록이 삭제되었습니다.');
            }
        });

        // 모바일 히스토리 패널 토글
        mobileHistoryBtn.addEventListener('click', () => {
            historyPanel.classList.toggle('hidden');
            historyPanel.classList.toggle('flex');
        });

        // 결과값 클립보드 복사 (execCommand 사용)
        copyBtn.addEventListener('click', () => {
            const textToCopy = calculator.currentOperand;
            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast(`복사됨: ${calculator.getDisplayNumber(textToCopy)}`);
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(tempInput);
        });

        // 다크 모드 / 라이트 모드 전환 및 초기화
        function initTheme() {
            const savedTheme = localStorage.getItem('calculator-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('calculator-theme', isDark ? 'dark' : 'light');
        });

        // 키보드 입력 지원 및 시각적 피드백
        function triggerButtonVisual(selector) {
            const btn = document.querySelector(selector);
            if (btn) {
                btn.classList.add('scale-95', 'ring-2', 'ring-indigo-400');
                setTimeout(() => {
                    btn.classList.remove('scale-95', 'ring-2', 'ring-indigo-400');
                }, 120);
            }
        }

        window.addEventListener('keydown', (e) => {
            // 숫자 (0-9) 및 소수점 (.)
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                e.preventDefault();
                calculator.appendNumber(e.key);
                calculator.updateDisplay();
                triggerButtonVisual(`[data-number="${e.key}"]`);
            }
            // 사칙연산자
            else if (e.key === '+' || e.key === '-') {
                e.preventDefault();
                calculator.chooseOperation(e.key);
                calculator.updateDisplay();
                triggerButtonVisual(`[data-operator="${e.key}"]`);
            }
            else if (e.key === '*') {
                e.preventDefault();
                calculator.chooseOperation('×');
                calculator.updateDisplay();
                triggerButtonVisual(`[data-operator="×"]`);
            }
            else if (e.key === '/') {
                e.preventDefault();
                calculator.chooseOperation('÷');
                calculator.updateDisplay();
                triggerButtonVisual(`[data-operator="÷"]`);
            }
            // 백분율 (%)
            else if (e.key === '%') {
                e.preventDefault();
                calculator.percent();
                calculator.updateDisplay();
                triggerButtonVisual(`[data-action="percent"]`);
            }
            // 계산 실행 (Enter 또는 =)
            else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculator.compute(true);
                calculator.updateDisplay();
                triggerButtonVisual(`[data-action="equals"]`);
            }
            // 백스페이스 (Backspace)
            else if (e.key === 'Backspace') {
                e.preventDefault();
                calculator.delete();
                calculator.updateDisplay();
                triggerButtonVisual(`[data-action="delete"]`);
            }
            // 초기화 (Escape 또는 Delete)
            else if (e.key === 'Escape' || e.key === 'Delete') {
                e.preventDefault();
                calculator.clear();
                calculator.updateDisplay();
                triggerButtonVisual(`[data-action="clear"]`);
            }
        });

        // 초기 테마 적용
        initTheme();
    </script>
</body>
</html>
